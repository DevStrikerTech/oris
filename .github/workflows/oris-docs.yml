# Publishes https://devstrikertech.github.io/oris/ via GitHub Pages (build_type: workflow).
# Repo Settings → Pages → Source: GitHub Actions

name: Oris docs

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oris-docs
  cancel-in-progress: false

jobs:
  build-oris-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5.0"

      - name: Sync root markdown into docs/
        run: bash scripts/sync_doc_sources.sh

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-oris-docs:
    name: Deploy to GitHub Pages
    needs: build-oris-docs
    runs-on: ubuntu-latest
    environment:
      name: oris-docs
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
